<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>TONEKEEP</title>
  <link rel="stylesheet" href="style.css"/>
  <script type="importmap">
  {
    "imports": {
      "three":         "./vendor/three.module.js",
      "three/addons/": "./vendor/"
    }
  }
  </script>
</head>
<body>
<div id="plugin">

  <!-- 3D viewport -->
  <div id="viewport">
    <canvas id="webgl-canvas"></canvas>

    <div class="cnr" id="cnr-tl">
      <span class="cnr-text">ToneKeep</span>
      <span class="cnr-sub">Blackface Deluxe</span>
    </div>
    <div class="cnr" id="cnr-tr"></div>

    <span id="load-status"></span>
  </div>

  <!-- Knobs strip + flanking gain bars -->
  <div id="controls">

    <!-- Input gain bar — 0 dB tick at 76.9% (range -40→+12 dB) -->
    <div class="gain-bar" id="in-gain-bar">
      <span class="gain-bar-lbl">IN</span>
      <div class="gain-bar-track">
        <div class="gain-bar-fill" id="in-bar-fill"></div>
        <div class="gain-bar-zero" style="bottom:76.9%"></div>
      </div>
    </div>

    <div id="knobs-strip">
      <div class="k">
        <span class="k-lbl">IN GAIN</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="inputGain" data-default="0.7692">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-inputGain">+0.0 dB</span>
      </div>
      <div class="k">
        <span class="k-lbl">VOLUME</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="volume" data-default="0.6">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-volume">6.0</span>
      </div>
      <div class="k">
        <span class="k-lbl">TREBLE</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="treble" data-default="0.5">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-treble">5.0</span>
      </div>
      <div class="k">
        <span class="k-lbl">BASS</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="bass" data-default="0.5">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-bass">5.0</span>
      </div>
      <div class="k">
        <span class="k-lbl">REVERB</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="reverb" data-default="0.3">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-reverb">3.0</span>
      </div>
      <div class="k">
        <span class="k-lbl">RATE</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="rate" data-default="0.2">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-rate">2.0</span>
      </div>
      <div class="k">
        <span class="k-lbl">DEPTH</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="depth" data-default="0">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-depth">1.0</span>
      </div>
      <div class="k">
        <span class="k-lbl">OUT GAIN</span>
        <svg class="knob-svg" viewBox="0 0 60 60" data-param="outputGain" data-default="0.625">
          <circle class="k-body" cx="30" cy="30" r="26"/>
          <rect   class="k-notch" x="27" y="3" width="6" height="16" rx="1" transform="rotate(-135 30 30)"/>
        </svg>
        <span class="k-val" id="val-outputGain">+0.0 dB</span>
      </div>
    </div>

    <!-- Output gain bar — 0 dB tick at 62.5% (range -40→+24 dB) -->
    <div class="gain-bar" id="out-gain-bar">
      <span class="gain-bar-lbl">OUT</span>
      <div class="gain-bar-track">
        <div class="gain-bar-fill" id="out-bar-fill"></div>
        <div class="gain-bar-zero" style="bottom:62.5%"></div>
      </div>
    </div>

  </div>

  <!-- IR + Reverb selector rows -->
  <div id="io">
    <div class="io-row">
      <span class="io-label">CAB IR</span>
      <select class="io-select" id="cab-select">
        <option value="0">NONE</option>
      </select>
      <button class="io-toggle" id="cab-toggle" data-on="true"></button>
    </div>
    <div class="io-row">
      <span class="io-label">SPRING REV</span>
      <select class="io-select" id="rev-select">
        <option value="0">NONE</option>
      </select>
      <button class="io-toggle" id="rev-toggle" data-on="true"></button>
    </div>
  </div>

</div>
<script type="module" src="main.js"></script>
</body>
</html>
